:root{--ink:#1f2523;--muted:#6b726f;--line:#ecefed;--green:#23634d;--divine:#2f4a6e;--quran:#7a5a1e;--bg:#fff;--fs:22px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;font-size:17px;line-height:1.7}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:19px;color:var(--green)}.brand span{font-weight:400;color:var(--muted);font-size:16px}
.icon{font-size:20px;color:var(--muted);padding:4px 8px}
main{max-width:680px;margin:0 auto;padding:18px 22px 40px;outline:none}
.foot{max-width:680px;margin:0 auto;padding:16px 22px 32px;display:flex;gap:18px;justify-content:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.search{width:100%;font:inherit;font-size:17px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fafbfa;color:var(--ink);margin:4px 0 10px}
.search:focus{outline:2px solid #23634d33;border-color:#23634d55}
.tabs{display:flex;gap:6px;margin-bottom:6px;font-size:15px}
.tabs button{font:inherit;background:none;border:1px solid var(--line);border-radius:20px;padding:3px 14px;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--green);border-color:#23634d66}
.resume{display:block;margin:8px 0 6px;font-size:15px;color:var(--green)}
.part{font-size:14px;color:var(--muted);margin:22px 0 4px;letter-spacing:0}
ol.list{list-style:none;margin:0;padding:0}
ol.list li a{display:flex;align-items:baseline;gap:14px;padding:11px 2px;border-bottom:1px solid var(--line)}
ol.list li a:hover{background:#fafbfa}
.num{flex:0 0 2.2em;text-align:center;color:var(--green);font-size:16px;font-variant-numeric:tabular-nums}
.ttl{flex:1;font-size:18px}
.mark{color:var(--green);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
/* reader */
.rhead{text-align:center;margin:6px 0 18px}
.rhead .h{color:var(--muted);font-size:15px}
.rhead h1{font-size:21px;font-weight:700;margin:2px 0 0;color:var(--ink)}
.matn{font-size:var(--fs);line-height:2;text-align:justify;text-justify:inter-word;margin:0 0 .7em;word-spacing:.02em}
.k-p{color:var(--green)}
.k-d{color:var(--divine)}
.k-q{color:var(--quran)}
.k-r{border-bottom:1px dotted #b9c0bc}
.hon{font-size:.72em;color:var(--muted)}
.ref{font-size:calc(var(--fs)*.72);line-height:1.9;color:var(--muted);margin:.2em 0 .9em}
.tools{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.btn{font:inherit;font-size:15px;background:none;border:1px solid var(--line);border-radius:20px;padding:4px 16px;color:var(--muted);cursor:pointer}
.btn[aria-pressed=true]{color:var(--green);border-color:#23634d66}
.pager{display:flex;justify-content:space-between;margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.pager a{color:var(--green);padding:6px 4px}.pager .off{visibility:hidden}
.legend{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin:10px 0 0}
.legend i{font-style:normal}
.notes{margin-top:14px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.notes summary{cursor:pointer}
/* pages */
.page h1{font-size:21px;margin:4px 0 12px;color:var(--ink)}
.page h2{font-size:17px;margin:18px 0 6px;color:var(--green)}
.page p,.page li{font-size:16.5px;line-height:1.9}
.page a{color:var(--green);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{font:inherit;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--green);font-size:18px;cursor:pointer}
.preview{font-size:var(--fs);line-height:2;padding:10px 0}
@media (max-width:420px){main{padding:14px 18px 32px}.ttl{font-size:17px}}
</style>

"part": "nawawi"}, {"n": 22, "heading": "الحديث الثاني والعشرون", "title": "أرأيت إذا صليت المكتوبات وصمت رمضان", "paras": [[{"t": "عَنْ أَبِي عَبْدِ اللَّهِ جَابِرِ بْنِ عَبْدِ اللَّهِ الْأَنْصَارِيِّ رَضِيَ اللَّهُ عَنْهُمَا: \"أَنَّ رَجُلًا سَأَلَ رَسُولَ اللَّهِ ﷺ فَقَالَ: أَرَأَيْت إذَا صَلَّيْت الْمَكْتُوبَاتِ، وَصُمْت رَمَضَانَ، وَأَحْلَلْت الْحَلَالَ، وَحَرَّمْت الْحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا؛ أَأَدْخُلُ الْجَنَّةَ؟ قَالَ: ", "k": "n"}, {"t": "نَعَمْ", "k": "p"}, {"t": "\".", "k": "n"}], [{"t": "رَوَاهُ مُسْلِمٌ [رقم:15].", "k": "n"}]], "review": [], "part": "nawawi"}, {"n": 23, "heading": "الحديث الثالث والعشرون", "title": "الطهور شطر الإيمان", "paras": [[{"t": "عَنْ أَبِي مَالِكٍ الْحَارِثِ بْنِ عَاصِمٍ الْأَشْعَرِيِّ  قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ \"", "k": "n"}, {"t": "الطَّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ", "k": "p"}, {"t": " ", "k": "n"}, {"t": "-أَوْ: تَمْلَأُ-", "k": "r"}, {"t": " ", "k": "n"}, {"t": "مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَك أَوْ عَلَيْك، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا", "k": "p"}, {"t": "\".", "k": "n"}], [{"t": "رَوَاهُ مُسْلِمٌ [رقم:223].", "k": "n"}]], "review": ["شك من الراوي؛ تُرك محايدًا."], "part": "nawawi"}, {"n": 24, "heading": "الحديث الرابع والعشرون", "title": "يا عبادي إني حرمت الظلم على نفسي", "paras": [[{"t": "عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ  عَنْ النَّبِيِّ ﷺ فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، أَنَّهُ قَالَ: \"", "k": "n"}, {"t": "يَا عِبَادِي: إنِّي حَرَّمْت الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْته بَيْنَكُمْ مُحَرَّمًا؛ فَلَا تَظَالَمُوا. يَا عِبَادِي! كُلُّكُمْ ضَالٌّ إلَّا مَنْ هَدَيْته، فَاسْتَهْدُونِي أَهْدِكُمْ. يَا عِبَادِي! كُلُّكُمْ جَائِعٌ إلَّا مَنْ أَطْعَمْته، فَاسْتَطْعِمُونِي أُطْعِمْكُمْ. يَا عِبَادِي! كُلُّكُمْ عَارٍ إلَّا مَنْ كَسَوْته، فَاسْتَكْسُونِي أَكْسُكُمْ. يَا عِبَادِي! إنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا؛ فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ. يَا عِبَادِي! إنَّكُمْ لَنْ تَبْلُغُوا ضُرِّي فَتَضُرُّونِي، وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ، فَسَأَلُونِي، فَأَعْطَيْت كُلَّ وَاحِدٍ مَسْأَلَته، مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إلَّا كَمَا يَنْقُصُ الْمِخْيَطُ إذَا أُدْخِلَ الْبَحْرَ. يَا عِبَادِي! إنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ، ثُمَّ أُوَفِّيكُمْ إيَّاهَا؛ فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدْ اللَّهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلَا يَلُومَن إلَّا نَفْسَهُ", "k": "d"}, {"t": "\".", "k": "n"}], [{"t": "رَوَاهُ مُسْلِمٌ [رقم:2577].", "k": "n"}]], "review": [], "part": "nawawi"}, {"n": 25, "heading": "الحديث الخامس والعشرون", "title": "ذهب أهل الدثور بالأجور", "paras": [[{"t": "عَنْ أَبِي ذَرٍّ  أَيْضًا، \"أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ ﷺ قَالُوا لِلنَّبِيِّ ﷺ يَا رَسُولَ اللَّهِ ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ؛ يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ. قَالَ: ", "k": "n"}, {"t": "أَوَلَيْسَ قَدْ جَعَلَ اللَّهُ لَكُمْ مَا تَصَّدَّقُونَ؟ إنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٌ بِمَعْرُوفٍ صَدَقَةٌ، وَنَهْيٌ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِي بُضْعِ أَحَدِكُمْ صَدَقَةٌ", "k": "p"}, {"t": ". قَالُوا: يَا رَسُولَ اللَّهِ أَيَأْتِي أَحَدُنَا شَهْوَتَهُ وَيَكُونُ لَهُ فِيهَا أَجْرٌ؟ قَالَ: ", "k": "n"}, {"t": "أَرَأَيْتُمْ لَوْ وَضَعَهَا فِي حَرَامٍ أَكَانَ عَلَيْهِ وِزْرٌ؟ فَكَذَلِكَ إذَا وَضَعَهَا فِي الْحَلَالِ، كَانَ لَهُ أَجْرٌ", "k": "p"}, {"t": "\".", "k": "n"}], [{"t": "رَوَاهُ مُسْلِمٌ [رقم:1006].", "k": "n"}]], "review": [], "part": "nawawi"}, {"n": 26, "heading": "الحديث السادس والعشرون", "title": "كل سلامى من الناس عليه صدقة", "paras": [[{"t": "عَنْ أَبِي هُرَيْرَةَ  قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ \"", "k": "n"}, {"t": "كُلُّ سُلَامَى مِنْ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنْ الطَّرِيقِ صَدَقَةٌ", "k": "p"}, {"t": "\".", "k": "n"}], [{"t": "رَوَاهُ الْبُخَارِيُّ [رقم:2989]، وَمُسْلِمٌ [رقم:1009].", "k": "n"}]], "review": [], "part": "nawawi"}, {"n": 27, "heading": "الحديث السابع والعشرون", "title": "البر حسن الخلق", "paras": [[{"t": "عَنْ النَّوَّاسِ بْنِ سَمْعَانَ  عَنْ النَّبِيِّ ﷺ قَالَ: \"", "k": "n"}, {"t": "الْبِرُّ حُسْنُ الْخُلُقِ، وَالْإِثْمُ مَا حَاكَ فِي صَدْرِك، وَكَرِهْت أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ", "k": "p"}, {"t": "\" رَوَاهُ مُسْلِمٌ [رقم:2553]. وَعَنْ وَابِصَةَ بْنِ مَعْبَدٍ  قَالَ: أَتَيْت رَسُولَ اللَّهِ ﷺ فَقَالَ: \"", "k": "n"}, {"t": "جِئْتَ تَسْأَلُ عَنْ الْبِرِّ؟", "k": "p"}, {"t": " قُلْت: نَعَمْ. فقَالَ: ", "k": "n"}, {"t": "استفت قلبك، الْبِرُّ مَا اطْمَأَنَّتْ إلَيْهِ النَّفْسُ، وَاطْمَأَنَّ إلَيْهِ الْقَلْبُ، وَالْإِثْمُ مَا حَاكَ فِي النَّفْسِ وَتَرَدَّدَ فِي الصَّدْرِ، وَإِنْ أَفْتَاك النَّاسُ وَأَفْتَوْك", "k": "p"}, {"t": "\" .", "k": "n"}], [{"t": "حَدِيثٌ حَسَنٌ، رَوَيْنَاهُ في مُسْنَدَي الْإِمَامَيْنِ أَحْمَدَ بْنِ حَنْبَلٍ [رقم:4/227]، وَالدَّارِمِيّ [2/246] بِإِسْنَادٍ حَسَنٍ.", "k": "n"}]], "review": [], "part": "nawawi"}, {"n": 28, "heading": "الحديث الثامن والعشرون", "title": "أوصيكم بتقوى الله وحسن الخلق", "paras": [[{"t": "عَنْ أَبِي نَجِيحٍ الْعِرْبَاضِ بْنِ سَارِيَةَ  قَالَ: \"وَعَظَنَا رَسُولُ اللَّهِ ﷺ مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ! كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا، قَالَ: ", "k": "n"}, {"t": "أُوصِيكُمْ بِتَقْوَى اللَّهِ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ؛ فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ", "k": "p"}, {"t": "\".", "k": "n"}], [{"t": "رَوَاهُ أَبُو دَاوُدَ [رقم:4607]، وَاَلتِّرْمِذِيُّ [رقم:266] وَقَالَ: حَدِيثٌ حَسَنٌ صَحِيحٌ.", "k": "n"}]], "review": [], "part": "nawawi"}, {"n": 29, "heading": "الحديث التاسع والعشرون", "title": "تعبد الله لا تشرك به شيئا", "paras": [[{"t": "عَنْ مُعَاذِ بْنِ جَبَلٍ  قَالَ: قُلْت يَا رَسُولَ اللَّهِ! أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الْجَنَّةَ وَيُبَاعِدْنِي مِنْ النَّارِ، قَالَ: \"", "k": "n"}, {"t": "لَقَدْ سَأَلْت عَنْ عَظِيمٍ، وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ: تَعْبُدُ اللَّهَ لَا تُشْرِكْ بِهِ شَيْئًا، وَتُقِيمُ الصَّلَاةَ، وَتُؤْتِي الزَّكَاةَ، وَتَصُومُ رَمَضَانَ، وَتَحُجُّ الْبَيْتَ", "k": "p"}, {"t": "، ثُمَّ قَالَ: ", "k": "n"}, {"t": "أَلَا أَدُلُّك عَلَى أَبْوَابِ الْخَيْرِ؟ الصَّوْمُ جُنَّةٌ، وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ، وَصَلَاةُ الرَّجُلِ فِي جَوْفِ اللَّيْلِ", "k": "p"}, {"t": "، ثُمَّ تَلَا: \" ", "k": "n"}, {"t": "تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ", "k": "q"}, {"t": " \" حَتَّى بَلَغَ \"", "k": "n"}, {"t": "يَعْمَلُونَ", "k": "q"}, {"t": "\"، ثُمَّ قَالَ: ", "k": "n"}, {"t": "أَلَا أُخْبِرُك بِرَأْسِ الْأَمْرِ وَعَمُودِهِ وَذُرْوَةِ سَنَامِهِ؟", "k": "p"}, {"t": " قُلْت: بَلَى يَا رَسُولَ اللَّهِ. قَالَ: ", "k": "n"}, {"t": "رَأْسُ الْأَمْرِ الْإِسْلَامُ، وَعَمُودُهُ الصَّلَاةُ، وَذُرْوَةُ سَنَامِهِ الْجِهَادُ", "k": "p"}, {"t": "، ثُمَّ قَالَ: ", "k": "n"}, {"t": "أَلَا أُخْبِرُك بِمَلَاكِ ذَلِكَ كُلِّهِ؟ <script>(function(){
"use strict";
var D=window.HADITH_DATA,H=D.hadith,app=document.getElementById('app');
var LS={get:function(k,d){try{var v=localStorage.getItem('fh.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
        set:function(k,v){try{localStorage.setItem('fh.'+k,JSON.stringify(v))}catch(e){}}};
var FS_MIN=18,FS_MAX=30,FS_DEF=22;
function fs(){var v=+LS.get('fontSize',FS_DEF);return (v>=FS_MIN&&v<=FS_MAX)?v:FS_DEF}
function applyFs(){document.documentElement.style.setProperty('--fs',fs()+'px')}
applyFs();
function norm(s){return String(s).replace(/[\u064B-\u0652\u0670\u0640\u200c-\u200f\ue000ﷺ]/g,'')
  .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/[^\u0621-\u064A0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
var IDX=H.map(function(h){return norm(h.title+' '+h.heading+' '+h.paras.map(function(p){return p.map(function(s){return s.t}).join('')}).join(' '))});
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function txt(s){return esc(s).replace(/\ue000/g,'<span class="hon">رضي الله عنه</span>')}
var AR='٠١٢٣٤٥٦٧٨٩';function an(n){return String(n).replace(/\d/g,function(d){return AR[d]})}
function bm(){return LS.get('bookmarks',[])}
function isRef(p){return p.every(function(s){return s.k==='n'})&&/^(رَوَاهُ|رواه|حَدِيثٌ|حديث)/.test(p[0].t.trim())}
var KN={p:'كلام النبي ﷺ',d:'كلام الله تعالى (حديث قدسي)',q:'آية قرآنية',r:'موضع مراجعة'};
function setTitle(t){document.title=t?t+' — '+D.meta.title:D.meta.title}

function viewIndex(q,tab){
  var marks=bm(),last=LS.get('last',null),qq=norm(q||'');
  var rows=H.filter(function(h,i){return (!qq||IDX[i].indexOf(qq)>=0)&&(tab!=='bm'||marks.indexOf(h.n)>=0)});
  var html='<input class="search" type="search" id="q" placeholder="ابحث في العناوين والمتون" value="'+esc(q||'')+'" aria-label="بحث">'+
   '<div class="tabs" role="group"><button data-tab="all" aria-pressed="'+(tab!=='bm')+'">الكل</button><button data-tab="bm" aria-pressed="'+(tab==='bm')+'">المحفوظة ('+an(marks.length)+')</button></div>';
  if(last&&!qq&&tab!=='bm') html+='<a class="resume" href="#/h/'+last+'">متابعة القراءة: الحديث '+an(last)+' ←</a>';
  if(!rows.length) html+='<p class="empty">لا توجد نتائج</p>';
  var cur='';
  rows.forEach(function(h){
    if(h.part!==cur){if(cur)html+='</ol>';cur=h.part;html+='<h2 class="part">'+(cur==='nawawi'?'الأربعون النووية':'زيادات ابن رجب')+'</h2><ol class="list">'}
    html+='<li><a href="#/h/'+h.n+'"><span class="num">'+an(h.n)+'</span><span class="ttl">'+esc(h.title)+'</span>'+(marks.indexOf(h.n)>=0?'<span class="mark" aria-label="محفوظ">●</span>':'')+'</a></li>';
  });
  if(cur)html+='</ol>';
  app.innerHTML=html;setTitle('');
  var inp=document.getElementById('q');
  inp.addEventListener('input',function(){var p=inp.selectionStart;viewIndex(inp.value,tab);var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)});
  app.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){viewIndex(inp.value,b.dataset.tab)}});
}

function viewHadith(n){
  var h=H[n-1];if(!h)return viewIndex();
  LS.set('last',n);
  var used={};
  var body=h.paras.map(function(p){
    if(isRef(p))return '<p class="ref">'+txt(p.map(function(s){return s.t}).join(''))+'</p>';
    return '<p class="matn">'+p.map(function(s){if(s.k!=='n')used[s.k]=1;
      return s.k==='n'?txt(s.t):'<span class="k-'+s.k+'"'+(s.k==='r'?' title="موضع مراجعة"':'')+'>'+txt(s.t)+'</span>'}).join('')+'</p>'}).join('');
  var on=bm().indexOf(n)>=0;
  var leg=Object.keys(used).map(function(k){return '<i class="k-'+k+'">● '+KN[k]+'</i>'}).join('');
  var notes=h.review.length||D.meta.corrections.some(function(c){return c.n===n})?
    '<details class="notes"><summary>ملاحظات النص</summary><ul>'+h.review.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+
    D.meta.corrections.filter(function(c){return c.n===n}).map(function(c){return '<li>تصحيح نقل: '+esc(c.note)+'</li>'}).join('')+'</ul></details>':'';
  app.innerHTML='<article><div class="rhead"><div class="h">'+esc(h.heading)+'</div><h1>'+esc(h.title)+'</h1></div>'+body+
    '<div class="legend">'+leg+'</div>'+
    '<div class="tools"><button class="btn" id="bm" aria-pressed="'+on+'">'+(on?'محفوظ':'حفظ')+'</button></div>'+notes+
    '<nav class="pager"><a class="'+(n>1?'':'off')+'" href="#/h/'+(n-1)+'">→ السابق</a><a href="#/">الفهرس</a><a class="'+(n<H.length?'':'off')+'" href="#/h/'+(n+1)+'">التالي ←</a></nav></article>';
  setTitle(h.heading);
  document.getElementById('bm').onclick=function(){var m=bm(),i=m.indexOf(n);if(i>=0)m.splice(i,1);else m.push(n);m.sort(function(a,b){return a-b});LS.set('bookmarks',m);viewHadith(n)};
  window.scrollTo(0,0);
}

function viewSettings(){
  app.innerHTML='<section class="page"><h1>الإعدادات</h1>'+
   '<div class="row"><span>حجم خط المتن</span><span class="stepper"><button id="dec" aria-label="تصغير">−</button><b id="fsv"></b><button id="inc" aria-label="تكبير">+</button></span></div>'+
   '<p class="preview"><span class="k-p">إنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ</span></p>'+
   '<div class="row"><span>إعادة الحجم الافتراضي</span><button class="btn" id="rst">إعادة</button></div>'+
   '<div class="row"><span>مسح المحفوظات وموضع القراءة</span><button class="btn" id="clr">مسح</button></div>'+
   '<h2>الألوان</h2><p><span class="k-p">● كلام النبي ﷺ</span><br><span class="k-d">● كلام الله تعالى في الأحاديث القدسية</span><br><span class="k-q">● الآيات القرآنية</span><br>● بقية النص (الإسناد المختصر، والسؤال، وكلام الصحابة) باللون الأساسي.</p>'+
   '<p><a href="#/about">المصدر</a> · <a href="#/terms">شروط الاستخدام</a> · <a href="#/privacy">الخصوصية</a></p></section>';
  function upd(){document.getElementById('fsv').textContent=an(fs())}upd();
  function set(v){LS.set('fontSize',Math.max(FS_MIN,Math.min(FS_MAX,v)));applyFs();upd()}
  document.getElementById('dec').onclick=function(){set(fs()-1)};
